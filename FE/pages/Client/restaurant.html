<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhà hàng – ND Travel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- CSS dùng chung (Layout) -->
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <!-- We'll import homepage.css to reuse card styles, and tour.css for banner/sidebar -->
  <link rel="stylesheet" href="../../assets/css/homepage.css" />
  <link rel="stylesheet" href="../../assets/css/tour.css" />
  <link rel="stylesheet" href="../../assets/css/restaurant.css" />

  <!-- Layout script (header + footer) -->
  <script src="../../js/layout.js"></script>
</head>

<body>
  <!-- BANNER -->
  <div
    class="tour-banner position-relative text-white text-center d-flex flex-column justify-content-center align-items-center">
    <div class="banner-overlay"></div>
    <div class="position-relative z-1">
      <h1 class="display-4 fw-bold mb-3">Danh sách Nhà Hàng</h1>
      <p class="lead">Khám phá những điểm đến ẩm thực tuyệt vời với mức giá tốt nhất</p>
    </div>
  </div>

  <div class="container my-5">
    <div class="row align-items-center mb-4">
      <div class="col-md-6">
        <h3 class="fw-bold mb-0">Tất cả Nhà Hàng</h3>
      </div>
      <div class="col-md-6 text-md-end mt-3 mt-md-0">
        <a href="booked.html" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
          <i class="fa-solid fa-utensils me-2"></i> Bàn Đã Đặt
        </a>
      </div>
    </div>

    <div class="row g-4">
      <!-- SIDEBAR LỌC -->
      <div class="col-lg-3">
        <div class="filter-sidebar bg-white shadow-sm p-4 rounded-4">
          <h5 class="fw-bold mb-4 border-bottom pb-2">Lọc Kết Quả</h5>

          <div class="mb-4">
            <label class="form-label fw-semibold text-muted small text-uppercase">Tìm kiếm</label>
            <input type="text" id="search-name" class="form-control rounded-3" placeholder="Nhập tên nhà hàng..." />
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-muted small text-uppercase">Khu vực</label>
            <select id="search-address" class="form-select rounded-3">
              <option value="">Tất cả khu vực</option>
              <!-- Render bằng JS -->
            </select>
          </div>

          <button id="btn-reset" class="btn btn-light w-100 rounded-pill fw-semibold text-muted">Xóa bộ lọc</button>
        </div>
      </div>

      <!-- MAIN LIST -->
      <div class="col-lg-9">
        <!-- Danh sách hiển thị Grid -->
        <div id="restaurant-list" class="row g-4">
          <!-- Render bằng JS -->
        </div>

        <div id="no-result" class="text-center py-5 d-none">
          <h5 class="text-danger fw-bold">Không tìm thấy nhà hàng phù hợp!</h5>
          <p class="text-muted">Thử thay đổi bộ lọc hoặc tìm kiếm lại.</p>
        </div>

        <!-- NÚT XEM THÊM / THU GỌN -->
        <div id="toggle-limit-container" class="text-center mt-4 d-none">
          <button id="toggle-limit-btn" class="btn btn-outline-primary rounded-pill px-4 fw-semibold">
            Xem thêm
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/restaurant.js"></script>
</body>

</html>
