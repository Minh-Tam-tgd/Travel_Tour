<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh Toán - ND Travel</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../../js/layout.js"></script>
  
  <style>
    body { background-color: #f4f6f9; }
    .qr-container { border: 2px dashed #0d6efd; border-radius: 10px; padding: 20px; text-align: center; background: #fff; }
    .qr-container img { width: 250px; height: 250px; object-fit: contain; }
  </style>
</head>
<body>
  
  <div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-qrcode me-2"></i> Thanh toán đơn hàng</h4>
      </div>
      <div class="card-body p-4">
        
        <div class="alert alert-info text-center" role="alert">
          <strong>Dịch vụ:</strong> <span id="item-name">Đang tải...</span><br>
          <strong>Ngày đi:</strong> <span id="booking-date">Đang tải...</span><br>
          <strong>Khách:</strong> <span id="guest-count">0</span> người
        </div>
        
        <h5 class="text-center mb-4">Số tiền cần chuyển: <span class="text-danger fw-bold fs-3 d-block mt-2" id="amount-to-pay">0đ</span></h5>
        
        <div class="qr-container mb-4">
          <img src="../../assets/images/qr-demo.png" alt="Mã QR Thanh Toán" id="qr-image" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg'">
          <p class="text-muted mt-3 mb-0 small">Quét mã bằng ứng dụng Ngân hàng hoặc Momo</p>
        </div>
        
        <div class="bg-light p-3 rounded-3 mb-4 text-center">
          <p class="mb-1"><strong>Ngân hàng:</strong> Vietcombank</p>
          <p class="mb-1"><strong>Chủ tài khoản:</strong> ND TRAVEL COMPANY</p>
          <p class="mb-0"><strong>Số tài khoản:</strong> <span class="text-primary fw-bold fs-5">0123456789</span></p>
        </div>
        
        <div class="mb-4">
          <label for="payment-proof" class="form-label fw-bold text-secondary">Tải lên minh chứng thanh toán <span class="text-danger">*</span>:</label>
          <input type="file" class="form-control" id="payment-proof" accept="image/*">
        </div>

        <button id="btn-confirm-paid" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow-sm fs-5">
          <i class="fa-solid fa-check-circle me-2"></i> Tôi đã chuyển khoản
        </button>
        <button id="btn-cancel" class="btn btn-outline-secondary w-100 py-2 mt-2 fw-semibold rounded-pill">
          Hủy giao dịch
        </button>
        
      </div>
    </div>
  </div>

  <script src="../../js/payment.js"></script>
</body>
</html>
