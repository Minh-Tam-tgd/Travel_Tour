<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập – ND Travel</title>
  <link rel="stylesheet" href="../../assets/css/auth.css" />
  <!-- Layout: header + footer -->
  <script src="../../js/layout.js"></script>
</head>
<body>
  <div class="page-bg"></div>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand-box">
        <span class="brand-mark">T</span>
        <div>
          <h1>Travel Tour</h1>
          <p>Đăng nhập để tiếp tục khám phá hành trình của bạn.</p>
        </div>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off">
        <h2>Đăng nhập</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" placeholder="nhập email" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" name="password" type="password" placeholder="nhập mật khẩu" required minlength="6" />
        </div>
        <button type="submit" class="btn-primary">Đăng nhập</button>
        <p class="form-footer">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      </form>
    </section>
  </main>
  <script src="../../js/auth.js"></script>
</body>
</html>
