<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử đặt chỗ – ND Travel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />

  <script src="../../js/layout.js"></script>
</head>
<body class="bg-light">
  <div class="container my-5 py-4">
    <h2 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-clock-rotate-left me-2"></i> Lịch sử đặt chỗ của bạn</h2>
    
    <div class="bg-white p-4 rounded-4 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">Mã đơn</th>
              <th scope="col">Dịch vụ</th>
              <th scope="col">Ngày đi/đến</th>
              <th scope="col">Số lượng</th>
              <th scope="col">Tổng tiền</th>
              <th scope="col">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="booking-list">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/booked.js"></script>
</body>
</html>
