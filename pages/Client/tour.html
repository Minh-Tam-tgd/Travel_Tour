<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách Tour – ND Travel</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <!-- We'll import homepage.css to reuse .tour-card, and tour.css for specific things -->
  <link rel="stylesheet" href="../../assets/css/homepage.css" />
  <link rel="stylesheet" href="../../assets/css/tour.css" />

  <script src="../../js/layout.js"></script>
</head>
<body>
  <!-- BANNER -->
  <div class="tour-banner position-relative text-white text-center d-flex flex-column justify-content-center align-items-center">
    <div class="banner-overlay"></div>
    <div class="position-relative z-1">
      <h1 class="display-4 fw-bold mb-3">Danh sách Tour Du Lịch</h1>
      <p class="lead">Khám phá những điểm đến tuyệt vời với mức giá tốt nhất</p>
    </div>
  </div>

  <div class="container my-5">
    <div class="row align-items-center mb-4">
      <div class="col-md-6">
        <h3 class="fw-bold mb-0">Tất cả các Tour</h3>
      </div>
      <div class="col-md-6 text-md-end mt-3 mt-md-0">
        <a href="dadat-tour.html" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
          <i class="fa-solid fa-suitcase-rolling me-2"></i> Xem tour đã đặt
        </a>
      </div>
    </div>

    <div class="row g-4">
      <!-- SIDEBAR LỌC -->
      <div class="col-lg-3">
        <div class="filter-sidebar bg-white shadow-sm p-4 rounded-4">
          <h5 class="fw-bold mb-4 border-bottom pb-2">Lọc Kết Quả</h5>
          
          <div class="mb-4">
            <label class="form-label fw-semibold text-muted small text-uppercase">Tìm kiếm</label>
            <input type="text" id="search-name" class="form-control rounded-3" placeholder="Nhập tên tour..." />
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-muted small text-uppercase">Mức giá</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="price" id="price1" value="all" checked>
              <label class="form-check-label" for="price1">Tất cả</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="price" id="price2" value="under_3m">
              <label class="form-check-label" for="price2">Dưới 3 triệu</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="price" id="price3" value="3m_to_5m">
              <label class="form-check-label" for="price3">Từ 3 - 5 triệu</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="price" id="price4" value="above_5m">
              <label class="form-check-label" for="price4">Trên 5 triệu</label>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold text-muted small text-uppercase">Thời gian</label>
            <select id="duration" class="form-select rounded-3">
              <option value="all">Tất cả</option>
              <option value="1N">1 Ngày</option>
              <option value="2N1Đ">2 Ngày 1 Đêm</option>
              <option value="3N2Đ">3 Ngày 2 Đêm</option>
              <option value="4N3Đ">4 Ngày 3 Đêm</option>
              <option value="khac">Khác</option>
            </select>
          </div>

          <button id="btn-reset" class="btn btn-light w-100 rounded-pill fw-semibold text-muted">Xóa bộ lọc</button>
        </div>
      </div>

      <!-- MAIN LIST -->
      <div class="col-lg-9">
        <!-- Danh sách hiển thị Grid -->
        <div id="tourList" class="row g-4">
          <!-- Render bằng JS -->
        </div>

        <div id="no-result" class="text-center py-5 d-none">
          <h5 class="text-danger fw-bold">Không tìm thấy tour phù hợp!</h5>
          <p class="text-muted">Thử thay đổi bộ lọc hoặc tìm kiếm lại.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/tour.js"></script>
</body>
</html>
