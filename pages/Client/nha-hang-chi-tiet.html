<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết Nhà Hàng – ND Travel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="../../assets/css/layout.css" />

  <script src="../../js/layout.js"></script>
</head>
<body class="bg-light">
  <div class="container my-5 py-4">
    <!-- TIÊU ĐỀ -->
    <div id="restaurant-header" class="mb-4">
      <h2 id="res-title" class="fw-bold">Đang tải...</h2>
      <div class="d-flex align-items-center text-muted">
        <i class="fa-solid fa-location-dot text-danger me-2"></i> 
        <span id="res-address">...</span>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="bg-white p-3 rounded-4 shadow-sm mb-4">
          <img id="main-image" src="" alt="Restaurant Image" class="w-100 rounded-3" style="height: 400px; object-fit: cover;" onerror="this.src='../../assets/images/buffet.jpg'" />
        </div>

        <div class="bg-white p-4 rounded-4 shadow-sm mb-4">
          <h4 class="fw-bold mb-3 border-bottom pb-2">Giới thiệu Nhà Hàng</h4>
          <p id="res-description" class="text-secondary" style="line-height: 1.8;">...</p>
        </div>
      </div>

      <!-- BẢNG THANH TOÁN -->
      <div class="col-lg-4">
        <div class="bg-white p-4 rounded-4 shadow-sm position-sticky" style="top: 100px;">
          <h4 class="fw-bold mb-3">Đặt Bàn Ngay</h4>
          
          <div class="price-box bg-light p-3 rounded-3 mb-4 text-center">
            <span class="fs-3 fw-bold text-primary" id="price">...</span> <span class="text-muted">/ bàn</span>
          </div>

          <form id="booking-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Ngày đến</label>
              <input type="date" class="form-control" id="booking-date" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-semibold">Số lượng bàn</label>
              <div class="input-group">
                <button class="btn btn-outline-secondary" type="button" id="btn-minus">-</button>
                <input type="number" class="form-control text-center" id="guest-count" value="1" min="1" max="10" readonly>
                <button class="btn btn-outline-secondary" type="button" id="btn-plus">+</button>
              </div>
            </div>

            <div class="border-top pt-3 mb-4">
              <div class="d-flex justify-content-between align-items-center mt-2">
                <span class="fw-bold fs-5">Tổng cộng</span>
                <span class="fw-bold fs-4 text-danger" id="total-price">0đ</span>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm" style="font-size: 1.1rem;">
              <i class="fa-solid fa-credit-card me-2"></i> Xác nhận đặt bàn
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/nha-hang-chi-tiet.js"></script>
</body>
</html>
